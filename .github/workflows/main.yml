name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Manual rebuild marker"
        required: false
        default: "manual"
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install web dependencies
        run: npm install

      - name: Install Capacitor Android
        run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Build web application
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Install native Unity Ads bridge
        run: bash scripts/install-native-ads.sh

      - name: Generate Android launcher icon
        run: python3 scripts/generate-android-icons.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CustomsStudyMobile1-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
