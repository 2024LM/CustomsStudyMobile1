name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Manual rebuild marker"
        required: false
        default: "manual"
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

concurrency:
  group: raje3-android-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install web dependencies
        run: npm install

      - name: Install Capacitor Android
        run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @playwright/test@1.58.2

      - name: Verify Arabic news preference and translation cache
        run: node tests/news-regressions.mjs

      - name: Verify news browsing and source preferences
        run: node tests/news-browsing-regressions.mjs

      - name: Verify shared news pagination
        run: node tests/news-pagination-regressions.mjs

      - name: Refresh bundled Moroccan news
        run: node scripts/fetch-news.mjs
        continue-on-error: true

      - name: Build web application
        run: npm run build
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_UNITY_BANNER_PLACEMENT: ${{ vars.UNITY_BANNER_PLACEMENT }}
          VITE_UNITY_RECTANGLE_PLACEMENT: ${{ vars.UNITY_RECTANGLE_PLACEMENT }}

      - name: Verify resource regressions
        run: node tests/resource-regressions.mjs

      - name: Verify text-to-speech preparation and lifecycle
        run: node tests/tts-regressions.mjs

      - name: Install browser for layout checks
        run: npx playwright install --with-deps chromium

      - name: Verify banner layout
        run: node tests/banner-layout.mjs

      - name: Verify reading frame
        run: node tests/tts-layout.mjs

      - name: Verify source discovery, rejection and approval
        run: node tests/news-source-validation.mjs

      - name: Verify inline news translation
        run: node tests/news-layout.mjs

      - name: Verify home news carousel and six navigation destinations
        run: node tests/home-news-layout.mjs

      - name: Create Android project
        run: npx cap add android

      - name: Set Android version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("android/app/build.gradle")
          content = path.read_text()
          content, codes = re.subn(r"versionCode\s+\d+", "versionCode 10001", content)
          content, names = re.subn(r'versionName\s+"[^" ]+"', 'versionName "1.0.01"', content)
          if codes != 1 or names != 1:
              raise SystemExit("Android version fields were not found uniquely")
          path.write_text(content)
          PY

      - name: Sync web assets
        run: npx cap sync android

      - name: Install native Android bridges
        run: bash scripts/install-native-ads.sh

      - name: Generate Android launcher icon
        run: |
          python3 -m pip install Pillow==11.3.0
          python3 scripts/generate-android-icons.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Verify APK integrity and signature
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -f "$APK"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | head -n 20

      - name: Verify APK installation on Android 14
        timeout-minutes: 12
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          ADB="$ANDROID_HOME/platform-tools/adb"
          EMULATOR="$ANDROID_HOME/emulator/emulator"

          "$SDKMANAGER" --install "platform-tools" "emulator" "system-images;android-34;default;x86_64"
          test -x "$ADB"
          test -x "$EMULATOR"

          if [ ! -e /dev/kvm ]; then
            echo "::warning::/dev/kvm is unavailable on this runner; skipping emulator install verification."
            exit 0
          fi

          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
          fi

          echo "no" | "$AVDMANAGER" create avd \
            --force \
            --name raje3_api34 \
            --package "system-images;android-34;default;x86_64" \
            --device "pixel_5"

          "$EMULATOR" \
            -avd raje3_api34 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -no-metrics \
            -gpu swiftshader_indirect \
            -accel on \
            > "$RUNNER_TEMP/raje3-emulator.log" 2>&1 &

          EMULATOR_PID=$!
          trap 'kill "$EMULATOR_PID" >/dev/null 2>&1 || true' EXIT

          "$ADB" start-server >/dev/null

          booted=""
          for i in $(seq 1 90); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "::warning::Android emulator exited before boot completed; skipping install verification."
              cat "$RUNNER_TEMP/raje3-emulator.log" || true
              exit 0
            fi

            state="$("$ADB" get-state 2>/dev/null || true)"
            if [ "$state" = "device" ]; then
              booted="$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              if [ "$booted" = "1" ]; then
                break
              fi
            fi
            sleep 2
          done

          if [ "$booted" != "1" ]; then
            echo "::warning::Android emulator did not finish booting within 3 minutes; skipping install verification."
            tail -n 120 "$RUNNER_TEMP/raje3-emulator.log" || true
            exit 0
          fi

          "$ADB" shell input keyevent 82 || true

          set +e
          INSTALL_OUTPUT="$("$ADB" install -r "$APK" 2>&1)"
          INSTALL_STATUS=$?
          set -e
          echo "$INSTALL_OUTPUT"

          if [ "$INSTALL_STATUS" -ne 0 ] || ! grep -q "Success" <<< "$INSTALL_OUTPUT"; then
            echo "::error::Android emulator booted, but Package Manager rejected the APK."
            exit 1
          fi

          "$ADB" shell pm path com.nexus.customsstudy
          "$ADB" shell monkey -p com.nexus.customsstudy -c android.intent.category.LAUNCHER 1
          "$ADB" shell dumpsys package com.nexus.customsstudy | grep -E "versionCode|versionName" | head -n 5
          "$ADB" uninstall com.nexus.customsstudy

      - name: Prepare distributable APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Raje3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Raje3
          path: Raje3.apk
          if-no-files-found: error

      - name: Publish direct APK download
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$LATEST_SHA" != "$GITHUB_SHA" ]; then
            echo "Skipping release publish for stale build $GITHUB_SHA; latest main is $LATEST_SHA."
            exit 0
          fi

          if ! gh release view current >/dev/null 2>&1; then
            gh release create current --title "Raje3 current APK" --notes "Direct APK download for the current Raje3 build." --target "$GITHUB_SHA"
          fi

          for attempt in 1 2 3; do
            if gh release upload current Raje3.apk --clobber; then
              exit 0
            fi
            echo "Release upload attempt $attempt failed; retrying..."
            sleep $((attempt * 3))
          done

          echo "::error::Failed to publish Raje3.apk after 3 attempts."
          exit 1
