name: Deploy Web to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify shared news pagination
        run: node tests/news-pagination-regressions.mjs && node tests/news-browsing-regressions.mjs

      - name: Refresh bundled Moroccan news
        run: node scripts/fetch-news.mjs
        continue-on-error: true

      - name: Prepare older news pages using the shared app parser
        run: node scripts/fetch-news-pages.mjs
        continue-on-error: true

      - name: Build web preview
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          VITE_BUILD_SHA: ${{ github.sha }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
